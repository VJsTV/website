version: '3.8'

x-ffmpeg-base: &ffmpeg-base
  image: jrottenberg/ffmpeg:4.4-ubuntu
  restart: always
  volumes:
    - ./:/app
  working_dir: /app

services:
  ch1-live:
    <<: *ffmpeg-base
    container_name: vjstv_ch1
    command: >
      -stream_loop -1 -re -f concat -safe 0 -i /app/channels/ch1-live/playlist.txt
      -c:v libx264 -preset veryfast -b:v 4000k -maxrate 5000k -bufsize 8000k
      -pix_fmt yuv420p -g 50
      -c:a aac -b:a 128k
      -f flv rtmp://a.rtmp.youtube.com/live2/${STREAM_KEY_1}
    healthcheck:
      test: ["CMD-SHELL", "pgrep ffmpeg || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  ch2-loop-gallery:
    <<: *ffmpeg-base
    container_name: vjstv_ch2
    command: >
      -stream_loop -1 -re -f concat -safe 0 -i /app/channels/ch2-loop-gallery/playlist.txt
      -c:v libx264 -preset veryfast -b:v 4000k -maxrate 5000k -bufsize 8000k
      -pix_fmt yuv420p -g 50
      -c:a aac -b:a 128k
      -f flv rtmp://a.rtmp.youtube.com/live2/${STREAM_KEY_2}
    healthcheck:
      test: ["CMD-SHELL", "pgrep ffmpeg || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  ch3-vj-education:
    <<: *ffmpeg-base
    container_name: vjstv_ch3
    command: >
      -stream_loop -1 -re -f concat -safe 0 -i /app/channels/ch3-vj-education/playlist.txt
      -c:v libx264 -preset veryfast -b:v 4000k -maxrate 5000k -bufsize 8000k
      -pix_fmt yuv420p -g 50
      -c:a aac -b:a 128k
      -f flv rtmp://a.rtmp.youtube.com/live2/${STREAM_KEY_3}
    healthcheck:
      test: ["CMD-SHELL", "pgrep ffmpeg || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Restart sidecar — the ONLY service that mounts docker.sock.
  # Exposes POST /restart/:channel over a unix socket at /run/restart.sock.
  restart-sidecar:
    image: node:18-alpine
    container_name: vjstv_restart_sidecar
    restart: always
    volumes:
      - ./sidecar:/app/sidecar
      - /var/run/docker.sock:/var/run/docker.sock
      - restart_socket:/run
    working_dir: /app/sidecar
    command: node restart-sidecar.js
    environment:
      - RESTART_SOCKET=/run/restart.sock

  scheduler:
    image: node:18-alpine
    container_name: vjstv_scheduler
    restart: always
    depends_on:
      - restart-sidecar
    volumes:
      - ./:/app
      - restart_socket:/run
      # No docker.sock mount — restarts go through restart-sidecar unix socket
    working_dir: /app/scripts
    command: sh -c "npm install && node scheduler.js"
    environment:
      - TZ=${TZ:-UTC}
      - SCHEDULE_SIGNING_KEY=${SCHEDULE_SIGNING_KEY}
      - HEARTBEAT_SECRET=${HEARTBEAT_SECRET}
      - HEARTBEAT_ENDPOINT=${HEARTBEAT_ENDPOINT:-https://vjstv.com/api/stream/heartbeat}
      - RESTART_SOCKET=/run/restart.sock
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const fs=require('fs'),f='/app/state/heartbeat-ch1-live.json';if(!fs.existsSync(f))process.exit(1);const age=Date.now()/1000-JSON.parse(fs.readFileSync(f)).last_tick;if(age>300)process.exit(1);\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  git-sync:
    image: alpine/git
    container_name: vjstv_git_sync
    restart: always
    volumes:
      - ./:/app
    working_dir: /app
    command: sh -c "while true; do git pull origin main 2>/dev/null || true; sleep 600; done"

  # Portainer — no host port mapping; access via Cloudflare Tunnel only.
  # Tunnel target: http://vjstv_portainer:9000 (internal Docker network).
  # To configure: cloudflared tunnel route --tunnel <id> --hostname portainer.vjstv.com
  portainer:
    image: portainer/portainer-ce:latest
    container_name: vjstv_portainer
    restart: always
    # No ports: mapping — Portainer is not exposed to the host network.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
  restart_socket:
