<script>
(function() {
  function vjsLoadVimeoThumbs() {
    document.querySelectorAll('.vjs-vimeo-thumb[data-vimeo]').forEach(function(el) {
      var id = el.getAttribute('data-vimeo');
      if (!id || el.dataset.vjsThumbLoaded) return;
      el.dataset.vjsThumbLoaded = '1';
      fetch('https://vimeo.com/api/oembed.json?url=https://vimeo.com/' + id + '&width=480')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.thumbnail_url) {
            el.style.backgroundImage    = 'url(' + data.thumbnail_url + ')';
            el.style.backgroundSize     = 'cover';
            el.style.backgroundPosition = 'center';
            el.classList.add('loaded');
          }
        }).catch(function() { el.removeAttribute('data-vjs-thumb-loaded'); });
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', vjsLoadVimeoThumbs);
  } else {
    vjsLoadVimeoThumbs();
  }
  window.vjsLoadVimeoThumbs = vjsLoadVimeoThumbs;
})();

document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('img:not([loading])').forEach(function(img) {
    if (!img.closest('header') && !img.closest('nav') && !img.closest('.hero')) {
      img.setAttribute('loading', 'lazy');
    }
  });
});

function vjsDismissPreloader() {
  var p = document.getElementById('vjs-preloader');
  var cw = document.getElementById('main-content');
  if (cw) cw.classList.add('vjs-ready');
  if (p && !p.classList.contains('fade-out')) {
    p.classList.add('fade-out');
    // Intentionally NOT setting display:none afterward. #vjs-preloader is
    // position:fixed (out of document flow), so once .fade-out drops its
    // opacity to 0 and pointer-events to none it's already invisible and
    // non-interactive — removing its box via display:none on top of that
    // was registering as a Cumulative Layout Shift for real users (Chrome
    // still counts the box going from "opacity 0, present" to "gone" as a
    // geometry change) for no visible benefit.
  }
}
window.addEventListener('load', vjsDismissPreloader);
setTimeout(vjsDismissPreloader, 6000);
</script>
