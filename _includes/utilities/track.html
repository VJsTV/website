<script>
(function() {
  var meta = document.querySelector('meta[name="vjs-exp"]');
  var variant = meta ? meta.getAttribute('content') : null;

  window._vjsTrackQueue = window._vjsTrackQueue || [];

  window.vjsTrack = function(name, props) {
    try {
      var payload = props ? Object.assign({}, props) : {};
      if (variant) payload.vjs_exp = variant;
      var entry = { name: name, props: payload, t: Date.now() };
      window._vjsTrackQueue.push(entry);
      if (typeof window.plausible === 'function') {
        window.plausible(name, { props: payload });
      }
    } catch (e) { /* never throw */ }
  };

  // Expose the variant for components that want to render conditionally.
  window.vjsExp = variant;
})();
</script>
