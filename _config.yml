baseurl: ""
url: "https://vjstv.com"
# API now lives at /api/* on the same origin via Cloudflare Pages Functions.
# Set api_url to a fully-qualified URL only if you need to override (e.g. a staging worker).
api_url: ""
# Cloudflare Turnstile site key. When unset, the widget is not rendered and the
# server-side check is skipped (development mode). Set both turnstile_site_key
# (here) and TURNSTILE_SECRET_KEY (env / Pages secret) to enable.
turnstile_site_key: ""
permalink: "/:title"

include:
  - _routes.json
  - _headers

plugins:
  - jekyll-feed

feed:
  path: atom.xml

collections:
  vjs:
    output: true
    permalink: /artists/:name
  projects:
    output: true
    permalink: /projects/:name
  events:
    output: true
    permalink: /events/:name
  studios:
    output: true
    permalink: /studios/:name
  technology:
    output: true
    permalink: /technology/:name
  sponsors:
    output: true
    permalink: /sponsors/:name
  loop_packs:
    output: true
    permalink: /marketplace/:name

future: true
highlighter: rouge

exclude:
  - .local
  - .replit
  - attached_assets
  - portfolios
  - _portfolio
  - blogs
  - _posts
  - _authors
  - _shop_items
  - shop
  - services
  - about
  - contact
  - features
  - elements
  - home-pages
  - CNAME
  - cloudflare.toml
  - github.toml
  - netlify.toml
  - README.md
  - Gemfile
  - Gemfile.lock
  - replit.md
  - node_modules
  - vendor
  - functions
  - api
  - vjstv-docker
  - _site
  - wrangler.jsonc
  - wrangler.json
  - .gitignore
