baseurl: ""
url: "https://vjstv.com"
# API now lives at /api/* on the same origin via Cloudflare Pages Functions.
# Set api_url to a fully-qualified URL only if you need to override (e.g. a staging worker).
api_url: ""
# Cloudflare Turnstile site key. When unset, the widget is not rendered and the
# server-side check is skipped (development mode). Set both turnstile_site_key
# (here) and TURNSTILE_SECRET_KEY (env / Pages secret) to enable.
turnstile_site_key: ""
# Plausible Analytics — REQUIRED for conversion tracking in production.
# Set this to your Plausible site domain (e.g. "vjstv.com") in your Cloudflare
# Pages environment variables or directly here before deploying.
# When empty, the Plausible script is not loaded and vjsTrack queues events
# locally as no-ops — conversion data will NOT be recorded.
# To enable: set plausible_domain to the domain registered in your Plausible account.
plausible_domain: "vjstv.com"
permalink: "/:title"

include:
  - _headers

plugins:
  - jekyll-feed

feed:
  path: atom.xml

collections:
  vjs:
    output: true
    permalink: /artists/:name
  projects:
    output: true
    permalink: /projects/:name
  events:
    output: true
    permalink: /events/:name
  studios:
    output: true
    permalink: /studios/:name
  technology:
    output: true
    permalink: /technology/:name
  sponsors:
    output: true
    permalink: /sponsors/:name
  loop_packs:
    output: true
    permalink: /marketplace/:name

future: true
highlighter: rouge

exclude:
  - .local
  - .replit
  - attached_assets
  - portfolios
  - _portfolio
  - blogs
  - _posts
  - _authors
  - _shop_items
  - shop
  - services
  - about
  - contact
  - features
  - elements
  - home-pages
  - CNAME
  - cloudflare.toml
  - github.toml
  - netlify.toml
  - README.md
  - AUDIT.md
  - GROWTH_AUDIT.md
  - WEBSITE_AUDIT_2026-08.md
  - Gemfile
  - Gemfile.lock
  - replit.md
  - node_modules
  - vendor
  - functions
  - api
  - vjstv-docker
  - _site
  - wrangler.jsonc
  - wrangler.json
  - .gitignore
