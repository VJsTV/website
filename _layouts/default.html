<!DOCTYPE html>
<html lang="en">
<head>
  {% include core/head/meta-seo-tags.html %}
  {% include core/head/meta-og-tags.html %}
  <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/images/favicon-96x96.png">
  {% include core/styles/styles.html %}
  {% include utilities/analytics.html %}
</head>
<body {% if page.overflow %} class="overflow-hidden" {% endif %}>
  <div class="page-loading" id="vjs-preloader">
    <div class="vjs-loader-inner">
      <svg class="vjs-loader-logo" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="vjs-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#00f0ff"/>
            <stop offset="50%" style="stop-color:#ff00e5"/>
            <stop offset="100%" style="stop-color:#ff4400"/>
          </linearGradient>
        </defs>
        <text x="100" y="45" text-anchor="middle" fill="url(#vjs-grad)" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="42" letter-spacing="4">VJs TV</text>
      </svg>
      <div class="vjs-loader-bar"><div class="vjs-loader-bar-fill"></div></div>
    </div>
  </div>
  <a href="#main-content" class="skip-to-content">Skip to content</a>
  <div class="content-wrapper" id="main-content" tabindex="-1">
    {{ content }}
  </div>
  {% include core/scripts/scripts.html %}
</body>
</html>
